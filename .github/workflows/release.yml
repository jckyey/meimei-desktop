name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Verify release version and signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($config.version)") {
            throw "Tag $env:GITHUB_REF_NAME must match app version v$($config.version)"
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY repository secret is missing'
          }
      - name: Build signed updater and installer
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Create update manifest
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw 'Updater signature was not produced' }
          $signature = (Get-Content $signaturePath -Raw).Trim()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($installer.Name)"
          $manifest = @{
            version = $config.version
            notes = "Meimei $($config.version)"
            platforms = @{ 'windows-x86_64' = @{ url = $url; signature = $signature } }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content latest.json -Encoding utf8
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          $assets = @($installer.FullName, "$($installer.FullName).sig", 'latest.json')
          gh release create $env:GITHUB_REF_NAME $assets --title "Meimei $env:GITHUB_REF_NAME" --notes "Meimei Windows 桌面宠物。首次安装请下载 setup.exe。"
